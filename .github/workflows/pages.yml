name: Deploy preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-flight - a half-applied
# deploy would leave the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tokens generate into dist/, which both @wertkit/ui and the preview read.
      - run: pnpm tokens
      - run: pnpm -F @wertkit/ui build
      - run: pnpm -F @wertkit/preview build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
